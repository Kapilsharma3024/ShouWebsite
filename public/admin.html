<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxelo 3D - Admin Panel</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--primary:#6366f1;--primary-hover:#4f46e5;
  --text:#e2e8f0;--text2:#94a3b8;--danger:#ef4444;--danger-hover:#dc2626;--success:#22c55e;
  --warning:#f59e0b;--radius:8px;--radius-sm:4px;--shadow:0 4px 24px rgba(0,0,0,.3);
  --sidebar-w:260px;--header-h:64px;
}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
a{color:var(--primary);text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{background:var(--bg2);border-radius:var(--radius);padding:48px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-card h1{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.login-card p{color:var(--text2);font-size:.875rem;margin-bottom:32px}
.login-card .brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-card .brand i{font-size:2rem;color:var(--primary)}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.8125rem;font-weight:500;margin-bottom:6px;color:var(--text2)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius-sm);color:var(--text);outline:none;transition:border-color .2s;font-size:.875rem}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Buttons */
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-weight:500;font-size:.875rem;display:inline-flex;align-items:center;gap:8px;border:none;transition:background .2s,opacity .2s}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:var(--danger-hover)}
.btn-outline{background:transparent;border:1px solid var(--bg3);color:var(--text)}
.btn-outline:hover:not(:disabled){background:var(--bg3)}
.btn-sm{padding:6px 12px;font-size:.8125rem}
.btn-block{width:100%;justify-content:center}

/* Layout */
.app{display:none}
.app.active{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg2);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;display:flex;flex-direction:column;border-right:1px solid var(--bg3)}
.sidebar-header{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bg3)}
.sidebar-header i{font-size:1.5rem;color:var(--primary)}
.sidebar-header span{font-weight:700;font-size:1.125rem}
.sidebar-nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--text2);cursor:pointer;transition:background .15s,color .15s;font-size:.875rem;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--primary);font-weight:500;border-right:3px solid var(--primary)}
.nav-item i{font-size:1.125rem;width:20px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--bg3)}
.sidebar-footer .btn{width:100%;justify-content:center}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0}
.header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:var(--bg2);border-bottom:1px solid var(--bg3);position:sticky;top:0;z-index:50}
.header h2{font-size:1.125rem;font-weight:600}
.content{padding:32px}

/* Cards */
.card{background:var(--bg2);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--bg3)}
.card+.card{margin-top:24px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bg3)}
.card-header h3{font-size:1rem;font-weight:600}
.card-header .btn{margin-left:auto}

/* Dashboard stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:32px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:20px;border:1px solid var(--bg3);display:flex;align-items:center;gap:16px}
.stat-card i{font-size:1.75rem;color:var(--primary);width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(99,102,241,.1);border-radius:var(--radius)}
.stat-card .stat-value{font-size:1.75rem;font-weight:700}
.stat-card .stat-label{color:var(--text2);font-size:.8125rem;margin-top:2px}

/* Data tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--bg3);color:var(--text2);font-weight:500;font-size:.8125rem;white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--bg3)}
td .actions{display:flex;gap:8px}

/* Forms in cards */
.inline-form{display:grid;gap:16px}
.inline-form .form-row{display:grid;gap:16px}
.inline-form .form-actions{display:flex;gap:12px;margin-top:8px}

/* Items list */
.items-list{display:flex;flex-direction:column;gap:12px}
.item-row{display:flex;align-items:flex-start;gap:16px;padding:16px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--bg3)}
.item-row .item-info{flex:1;min-width:0}
.item-row .item-info h4{font-size:.875rem;font-weight:600;margin-bottom:2px}
.item-row .item-info p{font-size:.8125rem;color:var(--text2)}
.item-row .item-actions{display:flex;gap:8px;flex-shrink:0}

/* Alerts */
.alert{padding:12px 16px;border-radius:var(--radius-sm);font-size:.875rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger)}
.alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--success)}
.alert-info{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);color:var(--primary)}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--text2)}
.empty-state i{font-size:3rem;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:.875rem}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius);padding:32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h3{font-size:1.125rem;font-weight:600;margin-bottom:24px}
.modal .form-actions{display:flex;gap:12px;margin-top:24px;justify-content:flex-end}

/* Tags / pills */
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;background:var(--bg3);color:var(--text2)}
.tag-primary{background:rgba(99,102,241,.15);color:var(--primary)}

/* Loading */
.spinner{width:20px;height:20px;border:2px solid var(--text2);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:64px 24px;color:var(--text2);gap:12px;font-size:.875rem}

/* Gallery Grid */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
.gallery-card{background:var(--bg);border-radius:var(--radius);overflow:hidden;border:1px solid var(--bg3);transition:border-color .2s}
.gallery-card:hover{border-color:var(--primary)}
.gallery-card .gallery-img{width:100%;height:180px;object-fit:cover;background:var(--bg3);display:block}
.gallery-card .gallery-img-placeholder{width:100%;height:180px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:2.5rem}
.gallery-card .gallery-body{padding:14px}
.gallery-card .gallery-body h4{font-size:.875rem;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery-card .gallery-body .gallery-cat{font-size:.75rem;color:var(--primary);margin-bottom:6px;text-transform:capitalize}
.gallery-card .gallery-body .gallery-desc{font-size:.8125rem;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.gallery-card .gallery-body .gallery-date{font-size:.75rem;color:var(--text2)}
.gallery-card .gallery-actions{display:flex;gap:6px;padding:0 14px 14px}

/* Filter pills */
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-pill{padding:6px 16px;border-radius:999px;font-size:.8125rem;border:1px solid var(--bg3);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s;text-transform:capitalize;font-family:inherit}
.filter-pill:hover{border-color:var(--primary);color:var(--text)}
.filter-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Image upload */
.upload-area{display:flex;align-items:center;gap:12px;margin-top:8px}
.upload-preview{width:80px;height:80px;border-radius:var(--radius-sm);object-fit:cover;background:var(--bg3);border:1px solid var(--bg3)}
.upload-preview-placeholder{width:80px;height:80px;border-radius:var(--radius-sm);background:var(--bg3);border:1px dashed var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:1.5rem}
.upload-info{display:flex;flex-direction:column;gap:8px}
.upload-info .upload-filename{font-size:.8125rem;color:var(--text2)}
.hidden-input{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
.story-photo-preview{width:48px;height:48px;border-radius:var(--radius-sm);object-fit:cover;background:var(--bg3)}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .header{padding:0 16px}
  .content{padding:16px}
  .form-row{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .login-card{padding:32px 24px}
  .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap" class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="brand">
      <i class="ri-admin-line"></i>
      <div><h1>Voxelo 3D</h1><p>Admin Panel</p></div>
    </div>
    <div id="loginError"></div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter admin password" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
      <i class="ri-login-box-line"></i> Sign In
    </button>
  </form>
</div>

<!-- APP -->
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class="ri-admin-line"></i>
      <span>Voxelo Admin</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button class="btn btn-outline" id="logoutBtn"><i class="ri-logout-box-r-line"></i> Logout</button>
    </div>
  </aside>
  <main class="main">
    <header class="header">
      <h2 id="pageTitle">Dashboard</h2>
      <span style="font-size:.8125rem;color:var(--text2)" id="headerBadge"></span>
    </header>
    <div class="content" id="mainContent"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<script>
(function(){
var $=function(s){return document.querySelector(s)}
var $$=function(s){return document.querySelectorAll(s)}

var token=localStorage.getItem('voxelo_admin_token')
var activeTab='dashboard'
var contentData=null

var navItems=[
  {id:'dashboard',label:'Dashboard',icon:'ri-dashboard-line'},
  {id:'site',label:'Site Settings',icon:'ri-settings-line'},
  {id:'hero',label:'Hero Section',icon:'ri-image-line'},
  {id:'about',label:'About Section',icon:'ri-information-line'},
  {id:'courses',label:'Courses',icon:'ri-book-open-line'},
  {id:'features',label:'Features',icon:'ri-star-line'},
  {id:'testimonials',label:'Testimonials',icon:'ri-chat-quote-line'},
  {id:'success-stories',label:'Success Stories',icon:'ri-trophy-line'},
  {id:'test-series',label:'Test Series',icon:'ri-file-list-3-line'},
  {id:'study-materials',label:'Study Materials',icon:'ri-folder-line'},
  {id:'faculty',label:'Faculty',icon:'ri-user-star-line'},
  {id:'batches',label:'Batches',icon:'ri-group-line'},
  {id:'faq',label:'FAQ',icon:'ri-question-answer-line'},
  {id:'exam-notifications',label:'Notifications',icon:'ri-notification-3-line'},
  {id:'gallery',label:'Gallery',icon:'ri-image-2-line'},
  {id:'posters',label:'Posters',icon:'ri-gallery-line'},
  {id:'blogs',label:'Blogs',icon:'ri-article-line'}
]

function api(path,opts){
  opts=opts||{}
  var headers={}
  if(token) headers['Authorization']='Bearer '+token
  if(!opts.noJson) headers['Content-Type']='application/json'
  return fetch(path,{method:opts.method||'GET',headers:headers,body:opts.body})
    .then(function(r){
      if(!r.ok) return r.text().then(function(t){throw new Error(t||'Request failed ('+r.status+')')})
      var ct=r.headers.get('content-type')
      if(ct&&ct.indexOf('application/json')!==-1) return r.json()
      return r.text()
    })
}

function showAlert(parent,msg,type){
  parent=typeof parent==='string'?$(parent):parent
  if(!parent) return
  var existing=parent.querySelector('.alert')
  if(existing) existing.remove()
  var icons={error:'ri-error-warning-line',success:'ri-check-line',info:'ri-information-line'}
  var div=document.createElement('div')
  div.className='alert alert-'+type
  div.innerHTML='<i class="'+icons[type]+'"></i> '+h(msg)
  parent.prepend(div)
  if(type==='success') setTimeout(function(){if(div.parentNode) div.remove()},5000)
}

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function formatDate(d){if(!d) return '';return new Date(d).toLocaleDateString('en-IN',{year:'numeric',month:'short',day:'numeric'})}

function toggleModal(html){
  var ov=$('#modalOverlay')
  var box=$('#modalBox')
  if(html){box.innerHTML=html;ov.classList.add('active')}
  else{ov.classList.remove('active')}
}
$('#modalOverlay').addEventListener('click',function(e){if(e.target===this) toggleModal(null)})

function uploadImage(file, onSuccess, onError, onProgress){
  var formData=new FormData()
  formData.append('image',file)
  fetch('/api/upload',{
    method:'POST',
    headers:{'Authorization':'Bearer '+token},
    body:formData
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(t||'Upload failed ('+r.status+')')})
    return r.json()
  }).then(function(data){
    if(data&&data.url) onSuccess(data.url)
    else throw new Error('No URL in upload response')
  }).catch(function(e){if(onError) onError(e.message)})
}

// ==== LOGIN ====
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault()
  var pw=$('#password').value
  var btn=$('#loginBtn')
  btn.disabled=true
  btn.innerHTML='<div class="spinner"></div> Signing in...'
  var err=$('#loginError')
  err.innerHTML=''
  fetch('/api/auth/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pw})
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(t||'Invalid credentials')})
    return r.json()
  }).then(function(data){
    token=data.token||data.access_token||data.jwt
    if(!token) throw new Error('No token received')
    localStorage.setItem('voxelo_admin_token',token)
    $('#loginWrap').style.display='none'
    $('#app').classList.add('active')
    initApp()
  }).catch(function(e){
    err.innerHTML='<div class="alert alert-error"><i class="ri-error-warning-line"></i> '+h(e.message)+'</div>'
  }).finally(function(){
    btn.disabled=false
    btn.innerHTML='<i class="ri-login-box-line"></i> Sign In'
  })
})

$('#logoutBtn').addEventListener('click',function(){
  localStorage.removeItem('voxelo_admin_token')
  token=null
  contentData=null
  $('#app').classList.remove('active')
  $('#loginWrap').style.display=''
  $('#password').value=''
})

// ==== APP INIT ====
function initApp(){
  renderSidebar()
  loadContent()
}

function renderSidebar(){
  var nav=$('#sidebarNav')
  nav.innerHTML=navItems.map(function(item){
    var cls=item.id===activeTab?'nav-item active':'nav-item'
    return '<button class="'+cls+'" data-tab="'+item.id+'"><i class="'+item.icon+'"></i> '+item.label+'</button>'
  }).join('')
  nav.querySelectorAll('.nav-item').forEach(function(btn){
    btn.addEventListener('click',function(){
      activeTab=this.dataset.tab
      renderSidebar()
      renderContent()
    })
  })
}

function loadContent(){
  var mc=$('#mainContent')
  mc.innerHTML='<div class="loading-wrap"><div class="spinner"></div> Loading...</div>'
  api('/api/content').then(function(data){
    contentData=data
    renderContent()
  }).catch(function(e){
    if(e.message.indexOf('401')!==-1||e.message.indexOf('403')!==-1){
      localStorage.removeItem('voxelo_admin_token')
      token=null
      $('#app').classList.remove('active')
      $('#loginWrap').style.display=''
    }else{
      $('#mainContent').innerHTML='<div class="empty-state"><i class="ri-error-warning-line"></i><p>Failed to load content: '+h(e.message)+'</p><button class="btn btn-primary" onclick="location.reload()" style="margin-top:16px"><i class="ri-refresh-line"></i> Retry</button></div>'
    }
  })
}

function renderContent(){
  var title=navItems.find(function(n){return n.id===activeTab})
  $('#pageTitle').textContent=title?title.label:''
  $('#headerBadge').textContent=''

  var mc=$('#mainContent')
  switch(activeTab){
    case 'dashboard': renderDashboard(mc);break
    case 'site': renderSite(mc);break
    case 'hero': renderHero(mc);break
    case 'about': renderAbout(mc);break
    case 'courses': renderCourses(mc);break
    case 'features': renderFeatures(mc);break
    case 'testimonials': renderTestimonials(mc);break
    case 'success-stories': renderSuccessStories(mc);break
    case 'test-series': renderTestSeries(mc);break
    case 'study-materials': renderStudyMaterials(mc);break
    case 'faculty': renderFaculty(mc);break
    case 'batches': renderBatches(mc);break
    case 'faq': renderFAQ(mc);break
    case 'exam-notifications': renderExamNotifications(mc);break
    case 'gallery': renderGallery(mc);break
    case 'posters': renderPosters(mc);break
    case 'blogs': renderBlogs(mc);break
    default: mc.innerHTML='<p>Select a section</p>'
  }
}

// ==== DASHBOARD ====
function renderDashboard(el){
  if(!contentData){el.innerHTML='<p>Loading...</p>';return}
  var d=contentData
  var stats=[
    {label:'Courses',value:(d.courses||[]).length,icon:'ri-book-open-line'},
    {label:'Success Stories',value:(d.successStories||[]).length,icon:'ri-trophy-line'},
    {label:'Test Series',value:d.testSeries?1:0,icon:'ri-file-list-3-line'},
    {label:'Faculty',value:(d.faculty||[]).length,icon:'ri-user-star-line'},
    {label:'Gallery',value:(d.gallery||[]).length,icon:'ri-image-2-line'},
    {label:'FAQ',value:(d.faq||[]).length,icon:'ri-question-answer-line'},
    {label:'Notifications',value:(d.examNotifications||[]).length,icon:'ri-notification-3-line'},
    {label:'Testimonials',value:(d.testimonials||[]).length,icon:'ri-chat-quote-line'}
  ]
  el.innerHTML='<div class="stats-grid">'+stats.map(function(s){
    return '<div class="stat-card"><i class="'+s.icon+'"></i><div><div class="stat-value">'+s.value+'</div><div class="stat-label">'+s.label+'</div></div></div>'
  }).join('')+'</div>'+
  '<div class="card"><div class="card-header"><h3>Quick Overview</h3></div>'+
  '<p style="color:var(--text2);font-size:.875rem">Site name: <strong>'+(d.site?h(d.site.name||'N/A'):'N/A')+'</strong> &middot; '+
  'Courses: <strong>'+(d.courses||[]).length+'</strong> &middot; '+
  'Faculty: <strong>'+(d.faculty||[]).length+'</strong> &middot; '+
  'Gallery: <strong>'+(d.gallery||[]).length+'</strong></p></div>'
}

// ==== SHARED SAVE LOGIC ====
function saveSection(endpoint,body,el){
  var btn=el.querySelector('.btn-primary')
  var orig=btn.innerHTML
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Saving...'
  api('/api/content/'+endpoint,{method:'PUT',body:body}).then(function(data){
    contentData[endpoint]=body
    if(data&&typeof data==='object') contentData[endpoint]=data
    showAlert(el,'success','Saved successfully')
  }).catch(function(e){
    showAlert(el,'error',e.message)
  }).finally(function(){btn.disabled=false;btn.innerHTML=orig})
}

// ==== SITE SETTINGS ====
function renderSite(el){
  var d=contentData&&contentData.site?contentData.site:{name:'',tagline:'',description:''}

function openCourseModal(course){
  var c=course||{title:'',category:'',description:'',duration:'',fee:'',featured:false,highlights:['']}
  var hls=(c.highlights||['']).map(function(hl,i){return '<div class="form-row" style="margin-bottom:8px"><input class="hlInput" value="'+h(hl||'')+'" style="flex:1"><button class="btn btn-outline btn-sm rm-hl" type="button" style="flex-shrink:0"><i class="ri-close-line"></i></button></div>'}).join('')
  toggleModal('<h3>'+(course?'Edit Course':'New Course')+'</h3>'+
  '<div class="form-group"><label>Title</label><input id="mcTitle" value="'+h(c.title||'')+'"></div>'+
  '<div class="form-row"><div class="form-group"><label>Category</label><input id="mcCat" value="'+h(c.category||'')+'"></div>'+
  '<div class="form-group"><label>Duration</label><input id="mcDur" value="'+h(c.duration||'')+'"></div></div>'+
  '<div class="form-row"><div class="form-group"><label>Fee</label><input id="mcFee" value="'+h(c.fee||'')+'"></div>'+
  '<div class="form-group" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="mcFeat" '+(c.featured?'checked':'')+'><label for="mcFeat" style="margin:0">Featured</label></div></div>'+
  '<div class="form-group"><label>Description</label><textarea id="mcDesc">'+h(c.description||'')+'</textarea></div>'+
  '<div class="form-group"><label>Highlights</label><div id="hlWrap">'+hls+'</div><button class="btn btn-outline btn-sm" id="addHl" type="button" style="margin-top:8px"><i class="ri-add-line"></i> Add Highlight</button></div>'+
  '<div class="form-actions"><button class="btn btn-outline" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'active\')">Cancel</button>'+
  '<button class="btn btn-primary" id="saveModalBtn"><i class="ri-save-line"></i> '+(course?'Update':'Create')+' Course</button></div>')

  $('#addHl').addEventListener('click',function(){var d=document.createElement('div');d.className='form-row';d.style.marginBottom='8px';d.innerHTML='<input class="hlInput" style="flex:1"><button class="btn btn-outline btn-sm rm-hl" type="button" style="flex-shrink:0"><i class="ri-close-line"></i></button>';$('#hlWrap').appendChild(d);d.querySelector('.rm-hl').addEventListener('click',function(){d.remove()})})
  $$('.rm-hl').forEach(function(b){b.addEventListener('click',function(){b.parentElement.remove()})})
  $('#saveModalBtn').addEventListener('click',function(){
    var hls=[];$$('.hlInput').forEach(function(i){if(i.value.trim()) hls.push(i.value.trim())})
    var body={title:$('#mcTitle').value,category:$('#mcCat').value,description:$('#mcDesc').value,duration:$('#mcDur').value,fee:$('#mcFee').value,featured:$('#mcFeat').checked,highlights:hls}
    var btn=$('#saveModalBtn')
    btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Saving...'
    var method=course?'PUT':'POST'
    var url=course?'/api/content/courses/'+course.id:'/api/content/courses'
    api(url,{method:method,body:body}).then(function(data){
      if(course&&data){var idx=contentData.courses.findIndex(function(x){return x.id==course.id});if(idx!==-1) contentData.courses[idx]=data}
      else contentData.courses.push(data||body)
      toggleModal(null);renderContent()
    }).catch(function(e){showAlert($('#modalBox'),'error',e.message)}).finally(function(){btn.disabled=false;btn.innerHTML='<i class="ri-save-line"></i> '+(course?'Update':'Create')+' Course'})
  })
}

function openSSModal(story){
  var s=story||{name:'',exam:'',rank:'',state:'',story:'',photo:''}
  toggleModal('<h3>'+(story?'Edit Success Story':'New Success Story')+'</h3>'+
  '<div class="form-row"><div class="form-group"><label>Name</label><input id="ssName" value="'+h(s.name||'')+'"></div><div class="form-group"><label>Exam</label><input id="ssExam" value="'+h(s.exam||'')+'"></div></div>'+
  '<div class="form-row"><div class="form-group"><label>Rank</label><input id="ssRank" value="'+h(s.rank||'')+'"></div><div class="form-group"><label>State</label><input id="ssState" value="'+h(s.state||'')+'"></div></div>'+
  '<div class="form-row"><div class="form-group"><label>Year</label><input id="ssYear" value="'+h(s.year||'')+'"></div><div class="form-group"><label>Story</label><textarea id="ssStory">'+h(s.story||'')+'</textarea></div></div>'+
  '<div class="form-group"><label>Photo</label>'+
  '<div class="upload-area">'+
  (s.photo?'<img class="upload-preview" src="'+h(s.photo)+'" alt="Photo preview" id="ssPhotoPreview">':'<div class="upload-preview-placeholder" id="ssPhotoPreview"><i class="ri-user-line"></i></div>')+
  '<div class="upload-info"><span class="upload-filename" id="ssPhotoFilename">'+(s.photo?'Current photo':'No photo')+'</span>'+
  '<input type="file" accept="image/*" class="hidden-input" id="ssPhotoInput">'+
  '<button class="btn btn-outline btn-sm" id="ssUploadBtn"><i class="ri-upload-line"></i> Upload Photo</button></div></div>'+
  '<input type="hidden" id="ssPhotoUrl" value="'+h(s.photo||'')+'">'+
  '</div>'+
  '<div class="form-actions"><button class="btn btn-outline" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'active\')">Cancel</button>'+
  '<button class="btn btn-primary" id="saveSS"><i class="ri-save-line"></i> '+(story?'Update':'Add')+' Story</button></div>')

  $('#ssUploadBtn').addEventListener('click',function(){
    $('#ssPhotoInput').click()
  })
  $('#ssPhotoInput').addEventListener('change',function(){
    var file=this.files[0]
    if(!file) return
    $('#ssPhotoFilename').textContent='Uploading...'
    $('#ssUploadBtn').disabled=true
    uploadImage(file,function(url){
      $('#ssPhotoUrl').value=url
      $('#ssPhotoFilename').textContent=file.name
      var preview=$('#ssPhotoPreview')
      if(preview.tagName==='IMG'){
        preview.src=url
      }else{
        var img=document.createElement('img')
        img.className='upload-preview'
        img.id='ssPhotoPreview'
        img.src=url
        img.alt='Photo preview'
        preview.parentNode.replaceChild(img,preview)
      }
      $('#ssUploadBtn').disabled=false
    },function(err){
      $('#ssPhotoFilename').textContent='Upload failed: '+err
      $('#ssUploadBtn').disabled=false
    })
  })

  $('#saveSS').addEventListener('click',function(){
    var body={name:$('#ssName').value,exam:$('#ssExam').value,rank:$('#ssRank').value,state:$('#ssState').value,year:$('#ssYear').value,story:$('#ssStory').value,photo:$('#ssPhotoUrl').value}
    var method=story?'PUT':'POST'
    var url=story?'/api/content/success-stories/'+story.id:'/api/content/success-stories'
    var btn=$('#saveSS')
    btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Saving...'
    api(url,{method:method,body:body}).then(function(data){
      if(story){var idx=contentData.successStories.findIndex(function(x){return x.id==story.id});if(idx!==-1) contentData.successStories[idx]=data||Object.assign({},story,body)}
      else contentData.successStories.push(data||body)
      toggleModal(null);renderContent()
    }).catch(function(e){showAlert($('#modalBox'),'error',e.message)}).finally(function(){btn.disabled=false;btn.innerHTML='<i class="ri-save-line"></i> '+(story?'Update':'Add')+' Story'})
  })
}

function renderStudyMaterials(el){

  el.innerHTML='<div class="card"><h3 style="margin-bottom:16px">Study Materials</h3>'+
  '<div class="inline-form">'+
  '<div class="form-group"><label>Title</label><input id="smTitle" value="'+h(d.title||'')+'"></div>'+
  '<div class="form-group"><label>Description</label><textarea id="smDesc">'+h(d.description||'')+'</textarea></div>'+
  '<div class="form-group"><label>Resources</label><div id="smRes">'+res.map(function(r,i){
    return '<div class="form-row" style="margin-bottom:8px"><input class="smRTitle" placeholder="Title" value="'+h(r.title||'')+'" style="flex:1"><input class="smRIcon" placeholder="Icon" value="'+h(r.icon||'')+'" style="flex:1"><input class="smRDesc" placeholder="Description" value="'+h(r.description||'')+'" style="flex:2"><button class="btn btn-outline btn-sm rm-smr" type="button" style="flex-shrink:0"><i class="ri-close-line"></i></button></div>'
  }).join('')+'</div><button class="btn btn-outline btn-sm" id="addRes" type="button" style="margin-top:8px"><i class="ri-add-line"></i> Add Resource</button></div>'+
  '<div class="form-actions"><button class="btn btn-primary" id="saveSM"><i class="ri-save-line"></i> Save Study Materials</button></div>'+
  '</div></div>'

  function bindRm(){$$('.rm-smr').forEach(function(b){b.addEventListener('click',function(){b.parentElement.remove()})})}
  bindRm()
  $('#addRes').addEventListener('click',function(){
    var d=document.createElement('div');d.className='form-row';d.style.marginBottom='8px';d.innerHTML='<input class="smRTitle" placeholder="Title" style="flex:1"><input class="smRIcon" placeholder="Icon" style="flex:1"><input class="smRDesc" placeholder="Description" style="flex:2"><button class="btn btn-outline btn-sm rm-smr" type="button" style="flex-shrink:0"><i class="ri-close-line"></i></button>'

var galleryFilter='All'

function renderGallery(el){
  var items=contentData?contentData.gallery||[]:[]
  var filtered=galleryFilter==='All'?items:items.filter(function(g){return g.category===galleryFilter})
  var cats=['All','achievement','newspaper','event','banner']

  var filterHtml='<div class="filter-pills">'+cats.map(function(cat){
    return '<button class="filter-pill'+(galleryFilter===cat?' active':'')+'" data-cat="'+cat+'">'+(cat==='All'?'All':cat)+'</button>'
  }).join('')+'</div>'

  var gridHtml=filtered.length===0
    ?'<div class="empty-state"><i class="ri-image-2-line"></i><p>No gallery items in this category</p></div>'
    :'<div class="gallery-grid">'+filtered.map(function(g){
      var imgHtml=g.image
        ?'<img class="gallery-img" src="'+h(g.image)+'" alt="'+h(g.title||'')+'" loading="lazy">'
        :'<div class="gallery-img-placeholder"><i class="ri-image-line"></i></div>'
      return '<div class="gallery-card">'+imgHtml+
        '<div class="gallery-body"><h4>'+h(g.title||'Untitled')+'</h4>'+
        '<div class="gallery-cat">'+h(g.category||'')+'</div>'+
        '<div class="gallery-desc">'+h(g.description||'No description')+'</div>'+
        '<div class="gallery-date">'+h(formatDate(g.date))+'</div></div>'+
        '<div class="gallery-actions">'+
        '<button class="btn btn-outline btn-sm edit-gallery" data-id="'+g.id+'"><i class="ri-edit-line"></i> Edit</button>'+
        '<button class="btn btn-danger btn-sm del-gallery" data-id="'+g.id+'"><i class="ri-delete-bin-line"></i> Delete</button>'+
        '</div></div>'
    }).join('')+'</div>'

  el.innerHTML='<div class="card"><div class="card-header"><h3>Gallery / Achievements ('+items.length+' items)</h3>'+
  '<button class="btn btn-primary btn-sm" id="addGalleryBtn"><i class="ri-add-line"></i> Add Item</button></div>'+
  filterHtml+gridHtml+'</div>'

  $$('.filter-pill').forEach(function(pill){
    pill.addEventListener('click',function(){
      galleryFilter=this.dataset.cat
      renderGallery(el)
    })
  })

  $('#addGalleryBtn').addEventListener('click',function(){openGalleryModal()})
  $$('.edit-gallery').forEach(function(b){
    b.addEventListener('click',function(){var g=items.find(function(x){return x.id==this.dataset.id});if(g) openGalleryModal(g)}.bind(b))
  })
  $$('.del-gallery').forEach(function(b){
    b.addEventListener('click',function(){delItem('gallery',this.dataset.id,el)}.bind(b))
  })
}

function openGalleryModal(item){
  var g=item||{title:'',category:'achievement',description:'',image:'',date:''}
  var imgPreview=g.image
    ?'<img class="upload-preview" src="'+h(g.image)+'" alt="Preview" id="glPhotoPreview">'
    :'<div class="upload-preview-placeholder" id="glPhotoPreview"><i class="ri-image-line"></i></div>'

  toggleModal('<h3>'+(item?'Edit Gallery Item':'New Gallery Item')+'</h3>'+
  '<div class="form-group"><label>Title</label><input id="glTitle" value="'+h(g.title||'')+'"></div>'+
  '<div class="form-row"><div class="form-group"><label>Category</label><select id="glCat">'+
  ['achievement','newspaper','event','banner'].map(function(c){
    return '<option value="'+c+'"'+(g.category===c?' selected':'')+'>'+c.charAt(0).toUpperCase()+c.slice(1)+'</option>'
  }).join('')+
  '</select></div><div class="form-group"><label>Date</label><input type="date" id="glDate" value="'+h((g.date||'').substring(0,10))+'"></div></div>'+
  '<div class="form-group"><label>Description</label><textarea id="glDesc">'+h(g.description||'')+'</textarea></div>'+
  '<div class="form-group"><label>Image</label>'+
  '<div class="upload-area">'+imgPreview+
  '<div class="upload-info"><span class="upload-filename" id="glPhotoFilename">'+(g.image?'Current image':'No image')+'</span>'+
  '<input type="file" accept="image/*" class="hidden-input" id="glPhotoInput">'+
  '<button class="btn btn-outline btn-sm" id="glUploadBtn"><i class="ri-upload-line"></i> Upload Image</button></div></div>'+
  '<input type="hidden" id="glPhotoUrl" value="'+h(g.image||'')+'">'+
  '</div>'+
  '<div class="form-actions"><button class="btn btn-outline" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'active\')">Cancel</button>'+
  '<button class="btn btn-primary" id="saveGl"><i class="ri-save-line"></i> '+(item?'Update':'Create')+' Item</button></div>')

  $('#glUploadBtn').addEventListener('click',function(){$('#glPhotoInput').click()})
  $('#glPhotoInput').addEventListener('change',function(){
    var file=this.files[0]
    if(!file) return
    $('#glPhotoFilename').textContent='Uploading...'
    $('#glUploadBtn').disabled=true
    uploadImage(file,function(url){
      $('#glPhotoUrl').value=url
      $('#glPhotoFilename').textContent=file.name
      var preview=$('#glPhotoPreview')
      if(preview.tagName==='IMG'){
        preview.src=url
      }else{
        var img=document.createElement('img')
        img.className='upload-preview'
        img.id='glPhotoPreview'
        img.src=url
        img.alt='Preview'
        preview.parentNode.replaceChild(img,preview)
      }
      $('#glUploadBtn').disabled=false
    },function(err){
      $('#glPhotoFilename').textContent='Upload failed: '+err
      $('#glUploadBtn').disabled=false
    })
  })

  $('#saveGl').addEventListener('click',function(){
    var body={title:$('#glTitle').value,category:$('#glCat').value,description:$('#glDesc').value,image:$('#glPhotoUrl').value,date:$('#glDate').value}
    var method=item?'PUT':'POST'
    var url=item?'/api/content/gallery/'+item.id:'/api/content/gallery'
    var btn=$('#saveGl')
    btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Saving...'
    api(url,{method:method,body:body}).then(function(data){
      if(item){var idx=contentData.gallery.findIndex(function(x){return x.id==item.id});if(idx!==-1) contentData.gallery[idx]=data||Object.assign({},item,body)}
      else contentData.gallery.push(data||body)
      toggleModal(null);renderContent()
    }).catch(function(e){showAlert($('#modalBox'),'error',e.message)}).finally(function(){btn.disabled=false;btn.innerHTML='<i class="ri-save-line"></i> '+(item?'Update':'Create')+' Item'})
  })
}

// ==== DELETE HELPER ====
function delItem(endpoint,id,el){
  if(!confirm('Are you sure you want to delete this item?')) return
  api('/api/content/'+endpoint+'/'+id,{method:'DELETE'}).then(function(){
    var key=endpoint==='success-stories'?'successStories':endpoint==='exam-notifications'?'examNotifications':endpoint==='study-materials'?'studyMaterials':endpoint==='test-series'?'testSeries':endpoint
    if(contentData[key]&&Array.isArray(contentData[key])) contentData[key]=contentData[key].filter(function(x){return x.id!=id})
    renderContent()
  }).catch(function(e){showAlert(el,'error',e.message)})
}
